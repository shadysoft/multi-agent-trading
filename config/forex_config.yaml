# Forex Trading Configuration

market:
  name: "Forex"
  type: "forex"
  trading_hours: "24/5"  # 24 hours, 5 days a week
  
# Trading Symbols
symbols:
  majors:
    - "EURUSD"
    - "GBPUSD"
    - "USDJPY"
    - "USDCHF"
    - "AUDUSD"
    - "USDCAD"
    - "NZDUSD"
  minors:
    - "EURGBP"
    - "EURJPY"
    - "GBPJPY"
    - "EURAUD"
    - "EURNZD"
  exotics:
    - "USDTRY"
    - "USDZAR"
    - "USDMXN"

# Active pairs to trade
active_symbols:
  - "EURUSD"
  - "GBPUSD"
  - "USDJPY"
  - "AUDUSD"

# Meta-Agent Thresholds
meta_agent:
  confidence_threshold: 0.75  # 75% for forex
  min_confidence_buy: 0.75
  min_confidence_sell: 0.75

# Risk Parameters
risk:
  max_spread_pips: 2.0
  min_atr_pips: 10.0
  max_position_size_percent: 1.0
  risk_per_trade_percent: 1.0
  
# Position Management
position_management:
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 3.0
  enable_breakeven: true
  breakeven_trigger_atr: 1.0
  enable_trailing_stop: true
  trailing_stop_atr: 1.5

# Technical Indicators
indicators:
  ema_periods: [20, 50, 200]
  adx_period: 14
  adx_threshold: 25
  atr_period: 14
  rsi_period: 14
  
# Smart Money Concepts
smc:
  min_order_block_touches: 2
  fvg_min_size_pips: 5
  liquidity_zone_lookback: 50
  
# Wave Analysis
wave:
  min_impulse_bars: 5
  min_correction_bars: 3
  impulse_threshold: 0.6
